name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    name: Lint & Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest anyio
          pip install -r backend/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check backend/ --exit-zero

      - name: Run Pytest
        run: |
          PYTHONPATH=backend:. pytest backend/tests/ -v

  docker-validate:
    name: Docker Build & Compose Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t vak-load-testing-backend:latest ./backend

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f infrastructure/docker-compose.yml config

      - name: Validate Prometheus Configuration and Alert Rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "${{ github.workspace }}/infrastructure/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.53.0 check config /etc/prometheus/prometheus.yml
