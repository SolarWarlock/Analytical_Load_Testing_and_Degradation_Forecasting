version: '3.8'

services:
  fastapi-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

    # БЛОК УПРАВЛЕНИЯ РЕСУРСАМИ (Для вашего напарника)
    deploy:
      resources:
        limits:
          # МАСШТАБИРОВАНИЕ CPU:
          # '0.5' означает, что серверу доступна только половина одного ядра.
          # Если графики утилизации CPU упираются в потолок мгновенно,
          # напарник может увеличить это значение до '1.0' или '2.0'.
          cpus: '2.0'

          # МАСШТАБИРОВАНИЕ RAM:
          # Жесткий лимит. Когда память дойдет до 512 Мб, Docker убьет процесс (OOM Kill).
          # Если для сбора качественного датасета нужно больше времени на "наблюдение"
          # за деградацией, увеличьте до '1024M' или '2G'.
          memory: 1G

        reservations:
          # Гарантированный минимум ресурсов, который система резервирует под контейнер
          cpus: '0.1'
          memory: 128M